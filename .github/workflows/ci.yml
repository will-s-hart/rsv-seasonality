name: Julia smoke check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  load-package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        julia-version: ['1.10', '1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3
        with:
          version: ${{ matrix.julia-version }}
      - name: Load project
        run: julia --startup-file=no --project=. scripts/check_setup.jl
      - name: Test synthetic package fixtures
        run: julia --startup-file=no --project=. test/runtests.jl
