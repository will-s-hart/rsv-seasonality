name: Python fixtures

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  synthetic-surveillance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install demographic workbook readers
        run: python -m pip install -r scripts/requirements-demography.txt
      - name: Run synthetic fixtures
        run: python -B -m unittest discover -s scripts -p 'test_*.py'
